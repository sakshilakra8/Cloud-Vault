spring:
  datasource:
    url: jdbc:h2:mem:shardvault;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        globally_quoted_identifiers: false
shardvault:
  chunk-size-bytes: 1048576
  upload-part-size-bytes: 1048576
  master-key-b64: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
  security:
    argon2:
      memory: 4096
      iterations: 1
    jwt:
      secret: c2hhcmR2YXVsdC1zdXBlci1zZWNyZXQtand0LWtleS1mb3Itc2lnbmluZy0yNTZiaXQ=
      access-token-expiration-seconds: 900
      refresh-token-expiration-seconds: 604800
    cookie:
      secure: false
    lockout:
      max-failed-attempts: 5
      lockout-duration-minutes: 15
    rate-limit:
      auth-per-ip-limit: 5
      auth-per-ip-duration-seconds: 60
      api-per-user-limit: 60
      api-per-user-duration-seconds: 60
